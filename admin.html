<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Velvet Partenope</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1, h2 { text-align: center; color: #333; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
    input, textarea, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    button { background-color: #28a745; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #218838; }
    .product-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .product-info { display: flex; align-items: center; gap: 15px; }
    .product-info img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .btn-delete { background-color: #dc3545; padding: 5px 10px; font-size: 14px; }
    .btn-delete:hover { background-color: #c82333; }
  </style>
</head>
<body>

<div class="container">
  <h1>Pannello Admin - Velvet Partenope</h1>
  
  <form id="productForm">
    <input type="text" id="productName" placeholder="Nome Prodotto" required>
    <input type="number" id="productPrice" step="0.01" placeholder="Prezzo (€)" required>
    <textarea id="productDescription" placeholder="Descrizione Prodotto" rows="3" required></textarea>
    <input type="url" id="productImageUrl" placeholder="Incolla Link Immagine (es. https://postimages.org/...)" required>
    <button type="submit" id="btnSubmit">Aggiungi Prodotto</button>
  </form>

  <h2>Prodotti Inseriti</h2>
  <div id="productsList">Caricamento prodotti...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Incolla qui le tue chiavi Firebase se diverse
  const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "velvetpartenope-d24bf.firebaseapp.com",
    projectId: "velvetpartenope-d24bf",
    storageBucket: "velvetpartenope-d24bf.appspot.com",
    messagingSenderId: "105...",
    appId: "1:105..."
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const productForm = document.getElementById('productForm');
  const productsList = document.getElementById('productsList');

  // Inserimento Prodotto
  productForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('productName').value;
    const price = parseFloat(document.getElementById('productPrice').value);
    const description = document.getElementById('productDescription').value;
    const imageUrl = document.getElementById('productImageUrl').value;

    try {
      await addDoc(collection(db, "products"), {
        name: name,
        price: price,
        description: description,
        imageUrl: imageUrl,
        createdAt: new Date()
      });
      alert('Prodotto aggiunto con successo!');
      productForm.reset();
    } catch (error) {
      console.error("Errore aggiunta:", error);
      alert('Errore durante il salvataggio: ' + error.message);
    }
  });

  // Mostra Prodotti in tempo reale
  onSnapshot(collection(db, "products"), (snapshot) => {
    productsList.innerHTML = '';
    if (snapshot.empty) {
      productsList.innerHTML = '<p style="text-align:center;">Nessun prodotto presente.</p>';
      return;
    }
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const div = document.createElement('div');
      div.className = 'product-item';
      div.innerHTML = `
        <div class="product-info">
          <img src="${data.imageUrl}" alt="${data.name}" onerror="this.src='https://via.placeholder.com/50'">
          <div>
            <strong>${data.name}</strong> - €${data.price}<br>
            <small>${data.description}</small>
          </div>
        </div>
        <button class="btn-delete" onclick="deleteProduct('${docSnap.id}')">Elimina</button>
      `;
      productsList.appendChild(div);
    });
  });

  // Funzione Elimina
  window.deleteProduct = async function(id) {
    if (confirm('Vuoi davvero eliminare questo prodotto dal negozio?')) {
      try {
        await deleteDoc(doc(db, "products", id));
        alert('Prodotto eliminato!');
      } catch (error) {
        console.error("Errore eliminazione:", error);
      }
    }
  };
</script>

</body>
</html>
